name: Bug 报告
description: 报告脚本报错、成品质量问题或环境兼容问题
labels: ["bug"]
body:
  - type: textarea
    id: describe
    attributes:
      label: 问题描述
      description: 发生了什么？期望的结果是什么？
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 输入文件类型、执行的命令、报错输出
      placeholder: |
        1. python scripts/extract_doc.py xxx.pdf -o /tmp/doc.txt
        2. ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: 环境版本
      description: Python 版本 / edge-tts 版本 / ffmpeg 版本 / 操作系统
      placeholder: "Python 3.10.11 / edge-tts 7.3.1 / ffmpeg 8.1.1 / macOS 15"
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 出错阶段
      options:
        - 阶段1 文档解析
        - 阶段2 画面生成
        - 阶段3 旁白/多音字
        - 阶段4 TTS/混音
        - 阶段5 字幕烧录
        - 阶段6 质检/封装
    validations:
      required: true
